services:
  pulsetrace:
    build: .
    image: pulsetrace:latest
    container_name: pulsetrace
    restart: unless-stopped
    ports:
      # Host nginx owns :80/:443 and reverse-proxies to this. Bind localhost-only
      # so the app port is never exposed publicly — nginx is the only front door.
      - "127.0.0.1:5000:5000"
      # MCP server (streamable-http) for remote agents.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      PORT: 5000
      PULSETRACE_BACKEND: ${PULSETRACE_BACKEND:-gemini}
      DOCS_ADMIN_TOKEN: ${DOCS_ADMIN_TOKEN:-pulsetrace-admin}
      PT_MCP_AUTOSTART: ${PT_MCP_AUTOSTART:-1}
      PULSETRACE_MCP_HOST: 0.0.0.0
      PULSETRACE_MCP_PORT: "8000"
    volumes:
      - ./data:/app/data
      - ./info:/app/info
    # Playwright needs more shm than the 64MB default.
    shm_size: "1gb"
    # OOM kill before host swaps to death on 2GB droplets.
    mem_limit: 3g
    mem_reservation: 1g
    healthcheck:
      test: ["CMD","python","-c","import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:5000/status',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
