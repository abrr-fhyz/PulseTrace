<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PulseTrace - Sentiment Intelligence</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
  <style>
    :root {
      --bg: #0b0f17; --panel: #131a26; --panel2: #1a2332; --border: #25324a;
      --text: #e6edf7; --muted: #8aa0bd; --accent: #6ee7b7; --accent2: #60a5fa;
      --neg: #f87171; --pos: #6ee7b7; --neu: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
                 font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h1, h2 { font-weight: 600; letter-spacing: -0.01em; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
    header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    main { display: grid; grid-template-columns: 360px 1fr; gap: 16px; padding: 16px 24px; min-height: calc(100vh - 60px); }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input, button, textarea {
      background: var(--panel2); color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 12px; font-size: 14px; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent2); }
    button { background: var(--accent2); color: #0b0f17; font-weight: 600; cursor: pointer; }
    button.secondary { background: var(--panel2); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    label.toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
    .log { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12px;
           color: var(--muted); background: #0d141f; border: 1px solid var(--border); border-radius: 8px;
           padding: 10px; height: 200px; overflow-y: auto; white-space: pre-wrap; }
    .log .ev { color: var(--text); }
    .log .err { color: var(--neg); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .kpi { background: var(--panel2); border-radius: 10px; padding: 14px; }
    .kpi b { font-size: 22px; }
    .kpi span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    #graph { height: 380px; background: #0d141f; border: 1px solid var(--border); border-radius: 8px; }
    canvas { max-height: 240px; }
    .cluster { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--panel2); }
    .cluster .hd { display: flex; justify-content: space-between; align-items: center; }
    .cluster .bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: #0b0f17; }
    .cluster .bar span { display: block; height: 100%; }
    .pos { background: var(--pos); } .neu { background: var(--neu); } .neg { background: var(--neg); }
    .answer { font-size: 14px; line-height: 1.55; }
    .cite { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
            border-radius: 4px; padding: 0 6px; font-size: 11px; color: var(--accent); margin: 2px 2px 0 0; }
    details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    .muted { color: var(--muted); font-size: 12px; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px;
            background: var(--panel2); border: 1px solid var(--border); font-size: 11px; color: var(--muted); }
    .log-line { display: block; }
  </style>
</head>
<body>
  <header>
    <div class="dot"></div>
    <h1>PulseTrace</h1>
    <span class="muted">Agentic sentiment intelligence - multi-source</span>
    <span id="run-pill" class="pill" style="margin-left:auto;display:none"></span>
  </header>

  <main>
    <section class="panel">
      <h2>Run</h2>
      <div style="display:flex;flex-direction:column;gap:10px">
        <input id="topic" placeholder="Topic, e.g. 'OpenAI Codex'" />
        <div class="row">
          <label class="toggle"><input type="checkbox" id="src-reddit" checked> Reddit</label>
          <label class="toggle"><input type="checkbox" id="src-hn" checked> HN</label>
        </div>
        <button id="go">Start agent</button>
      </div>

      <h2 style="margin-top:18px">Live log</h2>
      <div id="log" class="log"></div>

      <h2 style="margin-top:18px">Metrics</h2>
      <div class="grid3">
        <div class="kpi"><span>Posts</span><b id="m-posts">0</b></div>
        <div class="kpi"><span>Clusters</span><b id="m-clusters">0</b></div>
        <div class="kpi"><span>Entropy</span><b id="m-entropy">--</b></div>
      </div>

      <details style="margin-top:16px">
        <summary>Legacy v1 tools</summary>
        <div class="row" style="margin-top:8px;gap:6px">
          <button class="secondary" data-cmd="scrape">Scrape FB</button>
          <button class="secondary" data-cmd="process">Process</button>
          <button class="secondary" data-cmd="summarize">Summarize</button>
        </div>
      </details>
    </section>

    <section style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="panel">
        <h2>Topic graph</h2>
        <div id="graph"></div>
      </div>

      <div class="grid2">
        <div class="panel">
          <h2>Sentiment by cluster</h2>
          <canvas id="sentChart"></canvas>
        </div>
        <div class="panel">
          <h2>Clusters</h2>
          <div id="clusters" style="max-height:280px;overflow:auto"></div>
        </div>
      </div>

      <div class="panel">
        <h2>Ask the corpus</h2>
        <div class="row">
          <input id="q" placeholder="Ask anything about the gathered posts..." style="flex:1" />
          <button id="ask-btn">Ask</button>
        </div>
        <div id="answer" class="answer" style="margin-top:12px"></div>
      </div>
    </section>
  </main>

<script>
const $ = (s) => document.querySelector(s);
const logEl = $("#log");
let runId = null, sentChart = null, cy = null;

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function elem(tag, attrs, ...children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "style") e.style.cssText = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children) {
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return e;
}

function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  const line = elem("div", { class: "log-line " + (cls || "ev") }, `[${t}] ${msg}`);
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

async function start() {
  const topic = $("#topic").value.trim();
  if (!topic) return;
  const sources = [];
  if ($("#src-reddit").checked) sources.push("reddit");
  if ($("#src-hn").checked) sources.push("hn");
  $("#go").disabled = true;
  clear(logEl);
  clear($("#clusters"));
  clear($("#answer"));
  if (cy) { cy.destroy(); cy = null; }
  if (sentChart) { sentChart.destroy(); sentChart = null; }
  log(`Starting run for "${topic}" on [${sources.join(", ")}]...`);
  const r = await fetch("/run", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ topic, sources }),
  });
  const j = await r.json();
  if (j.error || !j.run_id) {
    log("Failed: " + (j.error || "no run_id"), "err");
    $("#go").disabled = false;
    return;
  }
  runId = j.run_id;
  const pill = $("#run-pill");
  pill.style.display = "inline-block";
  pill.textContent = "run " + runId;
  subscribe(runId);
}

function subscribe(rid) {
  const es = new EventSource("/events?run_id=" + encodeURIComponent(rid));
  es.onmessage = (e) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    handle(ev);
    if (ev.type === "_close" || ev.type === "done") {
      es.close();
      $("#go").disabled = false;
      drawGraph(rid);
    }
  };
  es.onerror = () => { log("SSE error", "err"); es.close(); $("#go").disabled = false; };
}

function handle(ev) {
  switch (ev.type) {
    case "open": log("stream open"); break;
    case "seeded": log("Seed queries: " + (ev.queries || []).join(" | ")); break;
    case "iter_start":
      log(`Iter ${ev.iter}: fetching ${(ev.queries || []).length} (query x source) pairs`); break;
    case "posts_fetched":
      $("#m-posts").textContent = ev.n_total;
      log(`+${ev.n_new} new posts (total ${ev.n_total})`); break;
    case "clustered":
      $("#m-clusters").textContent = ev.k;
      $("#m-entropy").textContent = Number(ev.entropy).toFixed(2);
      log(`Clustered -> ${ev.k} clusters, H=${Number(ev.entropy).toFixed(3)}`); break;
    case "labeled":
      renderClusters(ev.clusters || []);
      renderSentChart(ev.clusters || []);
      log(`Labeled ${(ev.clusters || []).length} clusters`); break;
    case "low_recall": log(`Low recall (${ev.n}) - retrying with broader query`); break;
    case "embed_error": log("Embed error: " + ev.err, "err"); break;
    case "done": log(`Done - stop_reason=${ev.stop_reason}, posts=${ev.n_posts}`); break;
  }
}

function renderClusters(cs) {
  const el = $("#clusters");
  clear(el);
  const sorted = cs.slice().sort((a, b) => b.n - a.n);
  for (const c of sorted) {
    const s = c.sentiment || { pos: 0, neu: 1, neg: 0 };
    const pos = Math.round(s.pos * 100);
    const neg = Math.round(s.neg * 100);
    const neu = Math.max(0, 100 - pos - neg);
    const card = elem("div", { class: "cluster" },
      elem("div", { class: "hd" },
        elem("b", null, String(c.label || "Unlabeled")),
        elem("span", { class: "pill" }, c.n + " posts"),
      ),
      elem("div", { class: "bar" },
        elem("span", { class: "pos", style: "width:" + pos + "%" }),
        elem("span", { class: "neu", style: "width:" + neu + "%" }),
        elem("span", { class: "neg", style: "width:" + neg + "%" }),
      ),
    );
    el.appendChild(card);
  }
}

function renderSentChart(cs) {
  const labels = cs.map(c => String(c.label || "?").slice(0, 18));
  const pos = cs.map(c => Math.round((c.sentiment && c.sentiment.pos || 0) * 100));
  const neu = cs.map(c => Math.round((c.sentiment && c.sentiment.neu || 0) * 100));
  const neg = cs.map(c => Math.round((c.sentiment && c.sentiment.neg || 0) * 100));
  const ctx = $("#sentChart");
  if (sentChart) sentChart.destroy();
  sentChart = new Chart(ctx, {
    type: "bar",
    data: { labels, datasets: [
      { label: "pos", data: pos, backgroundColor: "#6ee7b7" },
      { label: "neu", data: neu, backgroundColor: "#94a3b8" },
      { label: "neg", data: neg, backgroundColor: "#f87171" },
    ]},
    options: {
      responsive: true,
      plugins: { legend: { labels: { color: "#e6edf7" } } },
      scales: {
        x: { stacked: true, ticks: { color: "#8aa0bd" }, grid: { color: "#25324a" } },
        y: { stacked: true, ticks: { color: "#8aa0bd" }, grid: { color: "#25324a" }, max: 100 },
      },
    },
  });
}

async function drawGraph(rid) {
  const r = await fetch("/graph?run_id=" + encodeURIComponent(rid));
  const j = await r.json();
  if (cy) cy.destroy();
  cy = cytoscape({
    container: $("#graph"),
    elements: [...(j.nodes || []), ...(j.edges || [])],
    style: [
      { selector: "node", style: {
          "label": "data(label)", "color": "#e6edf7", "font-size": "11px",
          "background-color": "#60a5fa",
          "width":  (ele) => 20 + (ele.data("size") || 0) * 3,
          "height": (ele) => 20 + (ele.data("size") || 0) * 3,
          "text-valign": "bottom", "text-margin-y": 4,
      }},
      { selector: "edge", style: {
          "width": (ele) => 1 + (ele.data("weight") || 0) * 4,
          "line-color": "#25324a", "curve-style": "bezier", "opacity": 0.7,
      }},
    ],
    layout: { name: "cose", animate: false, padding: 30 },
  });
}

async function ask() {
  if (!runId) {
    const a = $("#answer"); clear(a); a.appendChild(document.createTextNode("Start a run first."));
    return;
  }
  const q = $("#q").value.trim(); if (!q) return;
  const a = $("#answer"); clear(a);
  a.appendChild(elem("span", { class: "muted" }, "Thinking..."));
  const r = await fetch("/ask", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ run_id: runId, q }),
  });
  const j = await r.json();
  clear(a);
  if (j.error) { a.appendChild(document.createTextNode(j.error)); return; }
  a.appendChild(elem("div", null, String(j.answer || "")));
  const cites = elem("div", { style: "margin-top:8px" });
  for (const c of (j.citations || [])) cites.appendChild(elem("span", { class: "cite" }, String(c)));
  a.appendChild(cites);
}

document.querySelectorAll("[data-cmd]").forEach(btn => {
  btn.addEventListener("click", async () => {
    const cmd = btn.getAttribute("data-cmd");
    log("legacy: " + cmd + "...");
    await fetch("/run-command", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ command: cmd }),
    });
  });
});

$("#go").addEventListener("click", start);
$("#ask-btn").addEventListener("click", ask);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
$("#topic").addEventListener("keydown", e => { if (e.key === "Enter") start(); });
</script>
</body>
</html>
