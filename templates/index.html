<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 40px;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .buttons-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            margin-bottom: 40px;
        }

        .action-button {
            background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%);
            border: none;
            border-radius: 15px;
            padding: 30px 20px;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
            position: relative;
            overflow: hidden;
        }

        .action-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.4);
        }

        .action-button:active {
            transform: translateY(-2px);
        }

        .action-button.process {
            background: linear-gradient(45deg, #fa709a 0%, #fee140 100%);
            box-shadow: 0 8px 25px rgba(250, 112, 154, 0.3);
        }

        .action-button.process:hover {
            box-shadow: 0 15px 35px rgba(250, 112, 154, 0.4);
        }

        .action-button.summarize {
            background: linear-gradient(45deg, #a8edea 0%, #fed6e3 100%);
            box-shadow: 0 8px 25px rgba(168, 237, 234, 0.3);
            color: #333;
        }

        .action-button.summarize:hover {
            box-shadow: 0 15px 35px rgba(168, 237, 234, 0.4);
        }

        .action-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .action-button .loading {
            display: none;
        }

        .action-button.running .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .status-box {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-left: 5px solid;
            transition: transform 0.3s ease;
        }

        .status-box:hover {
            transform: translateY(-3px);
        }

        .status-box.scrape {
            border-left-color: #4facfe;
        }

        .status-box.process {
            border-left-color: #fa709a;
        }

        .status-box.summarize {
            border-left-color: #a8edea;
        }

        .status-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-content {
            font-size: 1.5rem;
            font-weight: 700;
            color: #666;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #555;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .refresh-button {
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-left: auto;
        }

        .refresh-button:hover {
            background: #5a6268;
        }

        @media (max-width: 768px) {
            .buttons-container,
            .status-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .action-button {
                padding: 20px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Scraping Analysis Dashboard</h1>
        
        <div class="buttons-container">
            <button class="action-button scrape" onclick="runCommand('scrape')">
                <div class="loading"></div>
                <span>Scrape</span>
            </button>
            <button class="action-button process" onclick="runCommand('process')">
                <div class="loading"></div>
                <span>Process</span>
            </button>
            <button class="action-button summarize" onclick="runCommand('summarize')">
                <div class="loading"></div>
                <span>Summarize</span>
            </button>
        </div>

        <div class="status-container">
            <div class="status-box scrape">
                <div class="status-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M9,2V8H11V4.81L15.19,9H13V11H17V7H15V9.19L10.81,5H13V3H9V2M5,2C3.89,2 3,2.89 3,4V20C3,21.11 3.89,22 5,22H19C20.11,22 21,21.11 21,20V8.83C21,8.3 20.79,7.79 20.41,7.41L14.59,1.59C14.21,1.21 13.7,1 13.17,1H5V2Z"/>
                    </svg>
                    Screenshots Count
                    <button class="refresh-button" onclick="updateStatus()" title="Refresh">⟳</button>
                </div>
                <div class="status-content" id="screenshot-count">Loading...</div>
            </div>

            <div class="status-box process">
                <div class="status-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M14,2H6C4.89,2 4,2.89 4,4V20C4,21.11 4.89,22 6,22H18C19.11,22 20,21.11 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                    </svg>
                    Processed JSON Files
                    <button class="refresh-button" onclick="updateStatus()" title="Refresh">⟳</button>
                </div>
                <div class="status-content" id="json-count">Loading...</div>
            </div>

            <div class="status-box summarize">
                <div class="status-title">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M14,2H6C4.89,2 4,2.89 4,4V20C4,21.11 4.89,22 6,22H18C19.11,22 20,21.11 20,20V8L14,2M18,20H6V4H13V9H18V20Z"/>
                    </svg>
                    Summary Status
                    <button class="refresh-button" onclick="updateStatus()" title="Refresh">⟳</button>
                </div>
                <div class="status-text" id="summary-text">Loading...</div>
            </div>
        </div>
    </div>

    <script>
        let currentCommand = null;

        async function runCommand(command) {
            if (currentCommand) {
                alert('Another command is already running. Please wait.');
                return;
            }

            const button = document.querySelector(`.action-button.${command}`);
            const allButtons = document.querySelectorAll('.action-button');
            
            // Disable all buttons and show loading state
            allButtons.forEach(btn => btn.disabled = true);
            button.classList.add('running');
            currentCommand = command;

            try {
                const response = await fetch('/run-command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: command })
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(`${command} completed successfully!`);
                } else {
                    alert(`${command} failed: ${result.error}`);
                }
            } catch (error) {
                alert(`Error running ${command}: ${error.message}`);
            } finally {
                // Re-enable buttons and hide loading state
                allButtons.forEach(btn => btn.disabled = false);
                button.classList.remove('running');
                currentCommand = null;
                
                // Update status after command completion
                setTimeout(updateStatus, 1000);
            }
        }

        async function updateStatus() {
            try {
                const response = await fetch('/status');
                const status = await response.json();

                document.getElementById('screenshot-count').textContent = status.screenshots || '0';
                document.getElementById('json-count').textContent = status.json_files || '0';
                document.getElementById('summary-text').textContent = status.summary || 'No summary available';
            } catch (error) {
                console.error('Error updating status:', error);
                document.getElementById('screenshot-count').textContent = 'Error';
                document.getElementById('json-count').textContent = 'Error';
                document.getElementById('summary-text').textContent = 'Error loading summary';
            }
        }

        // Update status when page loads
        document.addEventListener('DOMContentLoaded', updateStatus);
        
        // Auto-refresh status every 30 seconds
        setInterval(updateStatus, 30000);
    </script>
</body>
</html>
